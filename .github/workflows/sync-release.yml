name: sync-v1.2.5-release
on:
  push:
    paths:
      - '.github/workflows/sync-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release payload
        run: curl -fsSL https://aka.doubaocdn.com/s/44ULnvt6jp -o /tmp/release.tar.gz
      - name: Apply payload
        run: |
          mkdir -p /tmp/payload
          tar -xzf /tmp/release.tar.gz -C /tmp/payload
          rsync -a --exclude='.git' --exclude='.github' /tmp/payload/ ./
      - name: Build single-file
        run: python3 tools/build_single.py
      - name: Commit main
        run: |
          git config user.name 'jianli-release-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m 'release: v1.2.5 创建房间与提示字号加大（同版本号）'
            git push origin HEAD:main
          fi
      - name: Prepare gh-pages
        run: |
          rm -rf gh-pages-dist
          mkdir -p gh-pages-dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='gh-pages-dist' ./ gh-pages-dist/
          cp '监利红中-横屏版.html' gh-pages-dist/index.html
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-dist
          user_name: 'jianli-release-bot'
          user_email: 'bot@users.noreply.github.com'
          commit_message: 'release: v1.2.5 UI enlarge (same version)'
